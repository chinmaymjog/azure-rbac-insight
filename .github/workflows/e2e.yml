name: End-to-end

# Builds the real Docker image, runs it on the runner (the disposable
# environment) and checks it starts, answers health checks, can import its
# dependencies and renders the app. See scripts/e2e.sh. No secrets are used.
# Not a required check: path-filtered on PRs.
on:
  pull_request:
    paths:
      - app.py
      - Dockerfile
      - requirements.txt
      - samples/**
      - scripts/e2e.sh
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run end-to-end script
        run: scripts/e2e.sh
